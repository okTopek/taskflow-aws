name: CI & Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build Frontend and Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Build and Smoke Test Backend
        working-directory: backend
        run: |
          npm ci
          node src/index.js &
          sleep 3
          curl --fail http://localhost:3000/api/health
