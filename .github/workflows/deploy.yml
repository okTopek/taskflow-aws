name: CD Deploy

on:
  workflow_run:
    workflows: ["CI & Security Scan"]
    types: [completed]
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend (Lambda)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Diagnostyka OIDC (tymczasowo)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | python3 -c "import sys,json,base64; p=sys.stdin.read().split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ['sub','aud','repository','ref','event_name','job_workflow_ref']}, indent=2))"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Package backend
        working-directory: backend
        run: |
          npm ci --omit=dev
          zip -r ../function.zip src package.json node_modules
      - name: Deploy to Lambda
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --handler src/lambda.handler
          aws lambda wait function-updated --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://function.zip
          aws lambda wait function-updated --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run build
          echo "{\"commit\":\"${{ github.event.workflow_run.head_sha }}\"}" > dist/version.json
      - name: Diagnostyka OIDC (tymczasowo)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | python3 -c "import sys,json,base64; p=sys.stdin.read().split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ['sub','aud','repository','ref','event_name','job_workflow_ref']}, indent=2))"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync to S3
        run: aws s3 sync frontend/dist "s3://${{ vars.S3_BUCKET }}" --delete
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  healthcheck:
    name: Live Healthcheck
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ vars.API_URL }}/health"
      - name: Check frontend version
        run: |
          expected="${{ github.event.workflow_run.head_sha }}"
          for i in $(seq 1 30); do
            current=$(curl --silent "https://${{ vars.CLOUDFRONT_DOMAIN }}/version.json" | grep -o '"commit":"[0-9a-f]*"' | cut -d'"' -f4)
            echo "Próba $i: wdrożona wersja = ${current:-brak}, oczekiwana = $expected"
            if [ "$current" = "$expected" ]; then
              echo "Aplikacja zwraca aktualną wersję."
              exit 0
            fi
            sleep 10
          done
          echo "Publiczny adres nie zwrócił oczekiwanej wersji."
          exit 1
